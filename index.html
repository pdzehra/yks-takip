<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Koçluk Sistemi - Ultra Pro V12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        
        @media print { 
            .print\:hidden { display: none !important; } 
            .print\:block { display: block !important; }
            .print\:m-0 { margin: 0 !important; padding: 0 !important; }
            .print\:shadow-none { shadow: none !important; border: 1px solid #eee !important; }
            body { background: white !important; }
            .bg-slate-50, .bg-indigo-50, .bg-blue-50, .bg-rose-50, .bg-emerald-50 { background-color: transparent !important; }
            .rounded-[2.5rem], .rounded-3xl { border-radius: 0.5rem !important; }
        }

        .transition-all { transition: all 0.3s ease; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- İkon Bileşeni ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.lucide) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}" style="width: ${size}px; height: ${size}px;"></i>`;
                    window.lucide.createIcons({ targets: [containerRef.current] });
                }
            }, [name, size]);
            return <span ref={containerRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        // --- Müfredat Verisi ---
        const yksSubjectData = {
            "TYT Türkçe": ["Sözcükte Anlam", "Cümlede Anlam", "Paragraf", "Ses Bilgisi", "Yazım Kuralları", "Noktalama İşaretleri", "Sözcükte Yapı", "İsimler", "Zamirler", "Sıfatlar", "Zarflar", "Edat-Bağlaç-Ünlem", "Fiiller", "Fiilimsi", "Cümlenin Ögeleri", "Cümle Türleri", "Anlatım Bozukluğu"],
            "TYT Matematik": ["Temel Kavramlar", "Sayı Basamakları", "Bölme-Bölünebilme", "EBOB-EKOK", "Rasyonel Sayılar", "Basit Eşitsizlikler", "Mutlak Değer", "Üslü Sayılar", "Köklü Sayılar", "Çarpanlara Ayırma", "Oran-Orantı", "Sayı Problemleri", "Kesir Problemleri", "Yaş Problemleri", "Hız Problemleri", "Yüzde-Kar-Zarar Problemleri", "Kümeler", "Fonksiyonlar", "Polinomlar", "Olasılık"],
            "TYT Geometri": ["Geometrik Kavramlar ve Açılar", "Üçgenler", "Çokgenler", "Dörtgenler", "Çember ve Daire", "Analitik Geometri", "Katı Cisimler"],
            "TYT Fizik": ["Fizik Bilimine Giriş", "Madde ve Özellikleri", "Hareket ve Kuvvet", "Enerji", "Isı ve Sıcaklık", "Basınç ve Kaldırma Kuvveti", "Elektrik ve Manyetizma", "Dalgalar", "Optik"],
            "TYT Kimya": ["Kimya Bilimi", "Atom ve Periyodik Sistem", "Kimyasal Türler Arası Etkileşimler", "Maddenin Halleri", "Doğa ve Kimya", "Karışımlar", "Asitler, Bazlar ve Tuzlar", "Kimya Her Yerde"],
            "TYT Biyoloji": ["Canlıların Ortak Özellikleri", "Canlıların Temel Bileşenleri", "Hücre", "Canlıların Sınıflandırılması", "Hücre Bölünmeleri", "Kalıtım", "Ekosistem Ekolojisi"],
            "TYT Tarih": ["Tarih ve Zaman", "İnsanlığın İlk Dönemleri", "Orta Çağda Dünya", "İlk ve Orta Çağlarda Türk Dünyası", "İslam Medeniyetinin Doğuşu", "İlk Türk İslam Devletleri", "Türkiye Tarihi", "Beylikten Devlete", "Osmanlı Siyaseti", "Milli Mücadele", "Atatürkçülük"],
            "TYT Coğrafya": ["Doğa ve İnsan", "Dünya'nın Şekli", "Harita Bilgisi", "Atmosfer ve İklim", "Yerin Şekillenmesi", "Nüfus ve Göç", "Bölgeler ve Ülkeler", "Doğal Afetler"],
            "TYT Felsefe": ["Felsefe'yi Tanıma", "Bilgi Felsefesi", "Varlık Felsefesi", "Ahlak felsefesi", "Din Felsefesi", "Siyaset Felsefesi", "Bilim Felsefesi"],
            "TYT Din Kültürü": ["Bilgi ve İnanç", "İslam ve İbadet", "Ahlak ve Değerler", "Hz. Muhammed (SAV)", "Vahiy ve Akıl"],
            "AYT Matematik": ["Mantık", "Kümeler ve İşlemler", "Fonksiyonlarda Uygulamalar", "İkinci Dereceden Denklemler", "Polinomlar", "İkinci Dereceden Fonksiyonlar (Parabol)", "Denklem ve Eşitsizlik Sistemleri", "Olasılık", "Üstel ve Logaritmik Fonksiyonlar", "Diziler", "Limit ve Süreklilik", "Türev ve Uygulamaları", "İntegral ve Uygulamaları"],
            "AYT Geometri": ["Üçgenlerin Eşliği ve Benzerliği", "Dik Üçgen ve Trigonometri", "Dörtgenler ve Çokgenler", "Katı Cisimlerin Alan ve Hacimleri", "Trigonometri", "Analitik Geometri", "Çember ve Daire", "Analitik Çember", "Temel Dönüşümler"],
            "AYT Edebiyat": ["Nazım Biçimleri, Türleri", "Edebi Sanatlar", "İslamiyet Öncesi Türk Edebiyatı", "Halk Edebiyatı", "Divan Edebiyatı", "Tanzimat Edebiyatı", "Servet-i Fünun ve Fecr-i Ati", "Milli Edebiyat", "Cumhuriyet Dönemi", "Edebi Akımlar", "Dünya Edebiyatı"],
            "AYT Tarih": ["Tarih Bilimi", "İslam Tarihi", "Türk-İslam Devletleri", "Türkiye Tarihi", "Osmanlı Tarihi", "Milli Mücadele", "İnkılaplar", "II. Dünya Savaşı ve Sonrası", "Soğuk Savaş", "Küreselleşen Dünya"],
            "AYT Coğrafya": ["Ekosistemlerin İşleyişi", "Nüfus Politikaları", "Türkiye'de Nüfus ve Yerleşme", "Türkiye Ekonomisi", "Küresel Ortam", "Çevre ve Toplum"],
            "AYT Fizik": ["Vektörler ve Bağıl Hareket", "Newton'un Yasaları", "Enerji ve Hareket", "İtme ve Çizgisel Momentum", "Tork, Denge ve Basit Makineler", "Elektriksel Kuvvet", "Manyetizma", "Çembersel Hareket", "Dalga Mekaniği", "Modern Fizik"],
            "AYT Kimya": ["Modern Atom Teorisi", "Gazlar", "Sıvı Çözeltiler", "Kimyasal Tepkimelerde Enerji, Hız ve Denge", "Asit-Baz Dengesi", "Çözünürlük Dengesi", "Kimya ve Elektrik", "Organik Bileşikler"],
            "AYT Biyoloji": ["Denetleyici ve Düzenleyici Sistem", "Sindirim, Dolaşım, Solunum, Boşaltım", "Üreme Sistemi", "Komünite ve Popülasyon Ekolojisi", "Genden Proteine", "Enerji Dönüşümleri"],
            "AYT Felsefe Grubu": ["Klasik Mantık", "Mantık ve Dil", "Psikoloji Bilimi", "Öğrenme, Bellek, Düşünme", "Sosyolojiye Giriş", "Toplumsal Yapı"],
            "AYT Din Kültürü": ["Din, Kültür ve Medeniyet", "Dünya ve Ahiret", "İslam ve Bilim", "Tasavvufi Yorumlar"],
            "YDT İngilizce": ["Grammar", "Vocabulary", "Cloze Test", "Sentence Completion", "Translation", "Reading Comprehension", "Dialogue Completion", "Irrelevant Sentence"]
        };

        const generateSubjectList = (data) => {
            const list = [];
            let counter = 1;
            Object.entries(data).forEach(([category, topics]) => {
                topics.forEach(topic => {
                    list.push({ id: counter++, category, name: topic, status: 'pending' });
                });
            });
            return list;
        };

        const calculateCategoryProgress = (subs, prefix) => {
            if (!subs) return 0;
            const relevant = subs.filter(s => s.category.startsWith(prefix));
            if (relevant.length === 0) return 0;
            const done = relevant.filter(s => s.status === 'done').length;
            return Math.round((done / relevant.length) * 100);
        };

        const getNewStudentData = (name) => ({
            id: Date.now().toString(),
            name: name,
            week: '',
            subjects: generateSubjectList(yksSubjectData),
            netScores: [],
            dailyPlan: { 'Pazartesi': [], 'Salı': [], 'Çarşamba': [], 'Perşembe': [], 'Cuma': [], 'Cumartesi': [], 'Pazar': [] },
            mistakes: [],
            revisions: [],
            pomodoroSettings: { work: 25, break: 5 }
        });

        // --- ANA UYGULAMA ---
        function App() {
            const [students, setStudents] = useState([]);
            const [activeStudentId, setActiveStudentId] = useState(null);
            const [isLoaded, setIsLoaded] = useState(false);
            const [compareTab, setCompareTab] = useState('summary');

            useEffect(() => {
                const saved = localStorage.getItem('kocluk_ultra_full_v12');
                if (saved) setStudents(JSON.parse(saved));
                setIsLoaded(true);
            }, []);

            useEffect(() => {
                if (isLoaded) localStorage.setItem('kocluk_ultra_full_v11', JSON.stringify(students));
            }, [students, isLoaded]);

            const handleAddStudent = (name) => {
                if (!name.trim()) return;
                setStudents([...students, getNewStudentData(name)]);
            };

            const handleDeleteStudent = (id) => {
                if (confirm("Bu öğrenci silinecek. Emin misiniz?")) {
                    setStudents(prev => prev.filter(s => s.id !== id));
                }
            };

            const handleExport = () => {
                const data = JSON.stringify(students, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `kocluk_yedek.json`; a.click();
            };

            if (!isLoaded) return <div className="p-10 text-center font-bold">Veriler Yükleniyor...</div>;

            if (activeStudentId) {
                const activeStudent = students.find(s => s.id === activeStudentId);
                if (!activeStudent) { setActiveStudentId(null); return null; }
                return <StudentDetail 
                    student={activeStudent} 
                    onBack={() => setActiveStudentId(null)} 
                    onUpdate={(updated) => setStudents(prev => prev.map(s => s.id === updated.id ? updated : s))} 
                />;
            }

            const maxNets = Math.max(...students.map(s => s.netScores.length), 0);
            const trialsRange = Array.from({ length: maxNets }, (_, i) => i + 1);

            return (
                <div className="max-w-7xl mx-auto p-6 md:p-12 print:p-0">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-10 gap-6 text-center md:text-left print:hidden">
                        <div className="flex items-center gap-4">
                            <div className="bg-indigo-600 p-4 rounded-2xl text-white shadow-lg shadow-indigo-100"><Icon name="users" size={32} /></div>
                            <h1 className="text-3xl font-extrabold text-indigo-950">Öğrenci Yönetim Paneli</h1>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={handleExport} className="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-xl font-bold hover:bg-slate-50 transition-all shadow-sm"><Icon name="download" /> Yedekle</button>
                            <label className="flex items-center gap-2 px-4 py-2 bg-emerald-600 text-white rounded-xl font-bold cursor-pointer hover:bg-emerald-700 transition-all shadow-sm">
                                <Icon name="upload" /> Yükle
                                <input type="file" onChange={(e) => {
                                    const file = e.target.files[0];
                                    if (!file) return;
                                    const r = new FileReader();
                                    r.onload = (ev) => setStudents(JSON.parse(ev.target.result));
                                    r.readAsText(file);
                                }} className="hidden" accept=".json" />
                            </label>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 mb-10 flex gap-4 print:hidden">
                        <input id="new-name" placeholder="Öğrenci Adı Soyadı..." className="flex-1 px-4 py-3 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-indigo-200 font-medium" onKeyDown={e => e.key === 'Enter' && (handleAddStudent(e.target.value), e.target.value='')} />
                        <button onClick={() => { const i = document.getElementById('new-name'); if(i.value) { handleAddStudent(i.value); i.value=''; } }} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold transition-all hover:bg-indigo-700">Ekle</button>
                    </div>

                    {students.length > 0 ? (
                        <div className="space-y-12">
                            <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 fade-in print:shadow-none print:border-slate-200 print:m-0">
                                <div className="flex flex-col md:flex-row items-center justify-between mb-8 gap-4">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-indigo-50 text-indigo-600 rounded-lg print:hidden"><Icon name="bar-chart-2" /></div>
                                        <h2 className="text-xl font-black text-slate-800 uppercase tracking-tight">Performans Karşılaştırma</h2>
                                    </div>
                                    <div className="flex p-1 bg-slate-100 rounded-xl print:hidden">
                                        <button onClick={() => setCompareTab('summary')} className={`px-4 py-1.5 rounded-lg text-[10px] font-black uppercase transition-all ${compareTab === 'summary' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400'}`}>Özet</button>
                                        <button onClick={() => setCompareTab('all-nets')} className={`px-4 py-1.5 rounded-lg text-[10px] font-black uppercase transition-all ${compareTab === 'all-nets' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400'}`}>Denemeler</button>
                                    </div>
                                    <button onClick={() => window.print()} className="flex items-center gap-2 px-4 py-2 bg-slate-900 text-white rounded-xl font-bold hover:bg-indigo-600 transition-all text-xs print:hidden"><Icon name="printer" size={16} /> Yazdır</button>
                                </div>

                                {compareTab === 'summary' ? (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left">
                                            <thead>
                                                <tr className="text-[10px] font-black uppercase text-slate-400 tracking-widest border-b border-slate-50">
                                                    <th className="pb-4 px-2">Öğrenci</th>
                                                    <th className="pb-4 px-2 text-center">TYT %</th>
                                                    <th className="pb-4 px-2 text-center">AYT %</th>
                                                    <th className="pb-4 px-2 text-center">YDT %</th>
                                                    <th className="pb-4 px-2 text-center">Son Net (T/A/Y)</th>
                                                    <th className="pb-4 px-2 text-right print:hidden">Dosya</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {students.map(s => {
                                                    const tytP = calculateCategoryProgress(s.subjects, "TYT");
                                                    const aytP = calculateCategoryProgress(s.subjects, "AYT");
                                                    const ydtP = calculateCategoryProgress(s.subjects, "YDT");
                                                    const lastTyt = s.netScores.filter(n => n.type === 'TYT').slice(-1)[0]?.score ?? '-';
                                                    const lastAyt = s.netScores.filter(n => n.type === 'AYT').slice(-1)[0]?.score ?? '-';
                                                    const lastYdt = s.netScores.filter(n => n.type === 'YDT').slice(-1)[0]?.score ?? '-';
                                                    return (
                                                        <tr key={s.id} className="hover:bg-slate-50/50 transition-colors">
                                                            <td className="py-4 px-2 font-bold text-slate-700">{s.name}</td>
                                                            <td className="py-4 px-2 text-center text-[10px] font-black text-blue-600">%{tytP}</td>
                                                            <td className="py-4 px-2 text-center text-[10px] font-black text-rose-600">%{aytP}</td>
                                                            <td className="py-4 px-2 text-center text-[10px] font-black text-emerald-600">%{ydtP}</td>
                                                            <td className="py-4 px-2 text-center font-black text-xs">{lastTyt} / {lastAyt} / {lastYdt}</td>
                                                            <td className="py-4 px-2 text-right print:hidden"><button onClick={() => setActiveStudentId(s.id)} className="p-2 text-indigo-400 hover:text-indigo-600 transition-all"><Icon name="arrow-right-circle" /></button></td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                ) : (
                                    <div className="overflow-x-auto border border-slate-100 rounded-3xl">
                                        <table className="w-full text-left bg-white min-w-[800px]">
                                            <thead>
                                                <tr className="bg-slate-900 text-white text-[10px] font-black uppercase tracking-widest">
                                                    <th className="p-5 sticky left-0 z-10 bg-slate-900">Öğrenci</th>
                                                    {trialsRange.map(num => (<th key={num} className="p-5 text-center border-l border-slate-800">{num}. Deneme</th>))}
                                                    <th className="p-5 text-center border-l border-slate-800">Ort.</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {students.map(s => {
                                                    const scores = s.netScores.map(n => n.score);
                                                    const avg = scores.length > 0 ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : '-';
                                                    return (
                                                        <tr key={s.id} className="hover:bg-slate-50/50 transition-colors">
                                                            <td className="p-5 font-black text-slate-800 sticky left-0 bg-white shadow-[2px_0_10px_rgba(0,0,0,0.02)]">{s.name}</td>
                                                            {trialsRange.map((_, i) => {
                                                                const n = s.netScores[i];
                                                                let color = "text-slate-300";
                                                                let bgColor = "";
                                                                if(n?.type === 'TYT') { color = "text-blue-600"; bgColor = "bg-blue-50"; }
                                                                else if(n?.type === 'AYT') { color = "text-rose-600"; bgColor = "bg-rose-50"; }
                                                                else if(n?.type === 'YDT') { color = "text-emerald-600"; bgColor = "bg-emerald-50"; }
                                                                return <td key={i} className="p-5 text-center border-l border-slate-50">{n ? <div className="flex flex-col"><span className={`text-xs font-black ${color} ${bgColor} px-2 py-0.5 rounded`}>{n.score}</span><span className="text-[8px] text-slate-300 uppercase mt-0.5 font-bold">{n.type}</span></div> : '--'}</td>
                                                            })}
                                                            <td className="p-5 text-center border-l border-slate-50 font-black text-indigo-600 bg-indigo-50/30">{avg}</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 print:hidden">
                                {students.map(s => (
                                    <div key={s.id} className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 hover:shadow-xl transition-all relative group">
                                        <button onClick={() => handleDeleteStudent(s.id)} className="absolute top-6 right-6 text-slate-200 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"><Icon name="trash-2" size={20} /></button>
                                        <h3 className="text-2xl font-black mb-6 text-slate-800">{s.name}</h3>
                                        <button onClick={() => setActiveStudentId(s.id)} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-indigo-600 transition-all flex justify-center items-center gap-2 uppercase tracking-widest text-xs">Dosyayı Aç <Icon name="arrow-right" /></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="text-center py-32 bg-white rounded-[3rem] border-4 border-dashed border-slate-100 fade-in print:hidden">
                            <Icon name="user-plus" size={48} className="text-slate-200 mb-6" />
                            <h3 className="text-2xl font-black text-slate-400 mb-2 uppercase tracking-tighter">Henüz Öğrenci Yok</h3>
                            <p className="text-slate-300 font-medium max-w-sm mx-auto">İlk öğrenciyi ekleyerek takibe başlayabilirsiniz.</p>
                        </div>
                    )}
                </div>
            );
        }

        // --- ÖĞRENCİ DETAY SAYFASI ---
        function StudentDetail({ student, onBack, onUpdate }) {
            const [activeTab, setActiveTab] = useState('weekly');
            const [subjectCategory, setSubjectCategory] = useState('TYT');
            const [localStudent, setLocalStudent] = useState(student);
            const [activeTaskDay, setActiveTaskDay] = useState(null);
            
            const [taskForm, setTaskForm] = useState({ category: '', topic: '', desc: '' });
            const [mistakeForm, setMistakeForm] = useState({ category: '', topic: '', reason: 'Bilgi Eksikliği' });
            const [remedyForm, setRemedyForm] = useState({ category: '', topic: '', desc: '' });
            const [netForm, setNetForm] = useState({ overall: '', tr: '', mat: '', sos: '', fen: '', edb: '', sos2: '', ydt: '' });
            
            const [netEntryMode, setNetEntryMode] = useState('overall');
            const [netEntryType, setNetEntryType] = useState('TYT');
            const [chartType, setChartType] = useState('bar'); 
            const [chartView, setChartView] = useState('last5'); 

            const [pomodoroTime, setPomodoroTime] = useState((localStudent.pomodoroSettings?.work || 25) * 60);
            const [isTimerActive, setIsTimerActive] = useState(false);
            const [isBreakMode, setIsBreakMode] = useState(false);

            useEffect(() => onUpdate(localStudent), [localStudent]);

            useEffect(() => {
                let interval = null;
                if (isTimerActive && pomodoroTime > 0) interval = setInterval(() => setPomodoroTime(p => p - 1), 1000);
                else if (pomodoroTime === 0) {
                    setIsTimerActive(false); setIsBreakMode(!isBreakMode);
                    setPomodoroTime((!isBreakMode ? (localStudent.pomodoroSettings?.break || 5) : (localStudent.pomodoroSettings?.work || 25)) * 60);
                }
                return () => clearInterval(interval);
            }, [isTimerActive, pomodoroTime, isBreakMode, localStudent.pomodoroSettings]);

            const updateField = (f, v) => setLocalStudent(p => ({ ...p, [f]: v }));

            const addTask = (day) => {
                if(!taskForm.topic && !taskForm.desc) return;
                const text = taskForm.topic ? `${taskForm.category}: ${taskForm.topic} ${taskForm.desc ? `(${taskForm.desc})` : ''}` : taskForm.desc;
                const newPlan = { ...localStudent.dailyPlan };
                newPlan[day] = [...(newPlan[day] || []), { id: Date.now(), text, done: false }];
                updateField('dailyPlan', newPlan);
                setTaskForm({ category: '', topic: '', desc: '' }); setActiveTaskDay(null);
            };

            const addNetFinal = () => {
                let score = 0;

                        score = tr + mat + sos + fen;
                        details = { "Türkçe": tr, "Matematik": mat, "Sosyal": sos, "Fen": fen };

                        const mat = parseFloat(netForm.mat)||0;
                        const edb = parseFloat(netForm.edb)||0;
                        const sos2 = parseFloat(netForm.sos2)||0;
                        const fen = parseFloat(netForm.fen)||0;

                        details,

ey={c} value={c}>{c}</option>)}</select>{taskForm.category && (<select className="w-full text-xs p-1.5 border rounded-lg" value={taskForm.topic} onChange={e => setTaskForm({...taskForm, topic: e.target.value})}><option value="">Konu Seç</option>{localStudent.subjects.filter(s => s.category === taskForm.category).map(s => <option key={s.id} value={s.name}>{s.name}</option>)}</select>)}<input className="w-full text-xs p-1.5 border rounded-lg outline-none" placeholder="Not..." value={taskForm.desc} onChange={e => setTaskForm({...taskForm, desc: e.target.value})} onKeyDown={e => e.key === 'Enter' && addTask(day)} /><div className="flex gap-2 pt-2"><button onClick={() => addTask(day)} className="flex-1 bg-indigo-600 text-white text-[10px] font-bold py-1.5 rounded-lg">Ekle</button><button onClick={() => setActiveTaskDay(null)} className="flex-1 bg-white border text-[10px] font-bold py-1.5 rounded-lg">Kapat</button></div></div>)}</div>

                                                <select className="w-full p-3 bg-slate-50 rounded-xl font-bold text-sm outline-none border-none" value={netEntryType} onChange={e => setNetEntryType(e.target.value)}><option>TYT</option><option>AYT</option><option>YDT</option></select>
                                                {netEntryMode === 'overall' ? (
                                                    <input type="number" step="0.25" placeholder="Toplam Net" className="w-full p-3 bg-slate-50 rounded-xl font-bold text-sm outline-none border-none" value={netForm.overall} onChange={e => setNetForm({...netForm, overall: e.target.value})} />
                                                ) : (
                                                    <div key={netEntryType} className="grid grid-cols-2 gap-2 animate-in fade-in">
                                                        {netEntryType === 'TYT' && (
                                                            <React.Fragment>
                                                                <input type="number" placeholder="Türkçe" className="p-2 text-xs bg-slate-50 rounded-lg outline-none" value={netForm.tr} onChange={e => setNetForm({...netForm, tr: e.target.value})} />
                                                                <input type="number" placeholder="Matematik" className="p-2 text-xs bg-slate-50 rounded-lg outline-none" value={netForm.mat} onChange={e => setNetForm({...netForm, mat: e.target.value})} />
                                                                <input type="number" placeholder="Sosyal" className="p-2 text-xs bg-slate-50 rounded-lg outline-none" value={netForm.sos} onChange={e => setNetForm({...netForm, sos: e.target.value})} />
                                                                <input type="number" placeholder="Fen" className="p-2 text-xs bg-slate-50 rounded-lg outline-none" value={netForm.fen} onChange={e => setNetForm({...netForm, fen: e.target.value})} />
                                                            </React.Fragment>
                                                        )}
                                                        {netEntryType === 'AYT' && (
                                                            <React.Fragment>
                                                                <input type="number" placeholder="Matematik" className="p-2 text-xs bg-slate-50 rounded-lg outline-none" value={netForm.mat} onChange={e => setNetForm({...netForm, mat: e.target.value})} />
                                                                <input type="number" placeholder="Edb-Sos1" className="p-2 text-xs bg-slate-50 rounded-lg outline-none" value={netForm.edb} onChange={e => setNetForm({...netForm, edb: e.target.value})} />
                                                                <input type="number" placeholder="Sosyal 2" className="p-2 text-xs bg-slate-50 rounded-lg outline-none" value={netForm.sos2} onChange={e => setNetForm({...netForm, sos2: e.target.value})} />
                                                                <input type="number" placeholder="Fen Bilimleri" className="p-2 text-xs bg-slate-50 rounded-lg outline-none" value={netForm.fen} onChange={e => setNetForm({...netForm, fen: e.target.value})} />
                                                            </React.Fragment>
                                                        )}
                                                        {netEntryType === 'YDT' && (
                                                            <div className="col-span-2">
                                                                <input type="number" placeholder="YDT Dil Neti" className="w-full p-3 bg-slate-50 rounded-xl outline-none font-bold" value={netForm.ydt} onChange={e => setNetForm({...netForm, ydt: e.target.value})} />
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                                <button onClick={addNetFinal} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black transition-all hover:bg-indigo-700 shadow-md">Kaydet</button>
                                            </div>
                                        </div>
                                        <div className="bg-white rounded-[2rem] border overflow-hidden shadow-sm">
                                            <div className="p-6 border-b bg-slate-50 font-black text-[10px] uppercase text-slate-400 tracking-widest">Kayıt Geçmişi</div>
                                            <div className="max-h-[350px] overflow-y-auto custom-scrollbar">
                                                {(localStudent.netScores || []).slice().reverse().map(n => (
                                                    <div key={n.id} className="p-5 border-b last:border-0 hover:bg-slate-50 transition-all flex flex-col group">
                                                        <div className="flex items-center justify-between">
                                                            <div className="flex items-center gap-2 mb-1">
                                                                <span className={`text-[10px] font-black uppercase px-2 py-0.5 rounded ${n.type==='TYT'?'bg-blue-100 text-blue-700':n.type==='AYT'?'bg-rose-100 text-rose-700':'bg-emerald-100 text-emerald-700'}`}>{n.type}</span>
                                                                <span className="text-lg font-black">{n.score}</span>
                                                            </div>
                                                            <button onClick={() => updateField('netScores', localStudent.netScores.filter(x => x.id !== n.id))} className="text-slate-200 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"><Icon name="trash-2" size={18}/></button>
                                                        </div>
                                                        <div className="text-[10px] font-bold text-slate-400 mb-2">{n.date}</div>
                                                        {n.details && (
                                                            <div className="grid grid-cols-2 gap-x-4 gap-y-1 pt-2 border-t border-slate-50">
                                                                {Object.entries(n.details).map(([label, val]) => (
                                                                    <div key={label} className="flex justify-between text-[10px] font-bold">
                                                                        <span className="text-slate-400">{label}:</span>
                                                                        <span className="text-slate-700">{val}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="lg:col-span-8 space-y-6 print:lg:col-span-12">
                                        <div className="bg-white rounded-[2.5rem] border p-8 shadow-sm flex flex-col h-[550px] print:shadow-none print:border-slate-200">
                                            <div className="flex flex-col md:flex-row justify-between items-center gap-6 mb-10"><h4 className="text-2xl font-black text-slate-800 flex items-center gap-3 uppercase tracking-tighter"><Icon name="trending-up" className="print:hidden" /> Net Analizi</h4><div className="flex gap-2 p-1.5 bg-slate-100 rounded-2xl print:hidden"><button onClick={() => setChartType('bar')} className={`px-4 py-2 rounded-xl text-xs font-black transition-all ${chartType === 'bar' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}`}>Sütun</button><button onClick={() => setChartType('line')} className={`px-4 py-2 rounded-xl text-xs font-black transition-all ${chartType === 'line' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}`}>Çizgi</button><div className="w-px h-6 bg-slate-200 mx-1 self-center"></div><button onClick={() => setChartView('last5')} className={`px-4 py-2 rounded-xl text-xs font-black transition-all ${chartView === 'last5' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}>Son 5</button><button onClick={() => setChartView('all')} className={`px-4 py-2 rounded-xl text-xs font-black transition-all ${chartView === 'all' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}>Tümü</button></div></div>
                                            <div className="flex-1 bg-slate-50/50 rounded-3xl p-6 relative border overflow-hidden shadow-inner print:bg-white print:border-slate-200">{renderChart()}</div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
